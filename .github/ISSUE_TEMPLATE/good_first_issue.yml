name: Good first issue (maintainer)
description: A small, self-contained task for a new contributor
title: "[good first issue] "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Keep this to one file, one behaviour. State the acceptance check so a newcomer can self-verify.
  - type: input
    id: directory
    attributes:
      label: Directory
      description: demo/ · sdk/ · mobile-shell/ · examples/ · docs/
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What to change
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How the contributor proves it works (command, screenshot, language list).
    validations:
      required: true
